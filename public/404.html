<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Redirecting...</title>
    <script>
      // SPA fallback: redirect 404 to index.html with the path as hash
      var path = window.location.pathname;
      window.location.replace('/#' + path);
    </script>
  </head>
  <body></body>
</html>
